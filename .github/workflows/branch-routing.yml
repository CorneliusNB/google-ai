name: Development branch routing

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  branch-routing:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce dev-first pull request targets
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BASE" == "main" ]]; then
            # One-time main-based fix. PR numbers cannot be reused.
            if [[ "$PR_NUMBER" == "63" && "$HEAD" == "fix/setup-guided-flow-main" && "$HEAD_REPO" == "$TARGET_REPO" ]]; then
              echo "Branch routing OK: main-based fix for PR #63"
            elif [[ "$HEAD" != "dev" || "$HEAD_REPO" != "$TARGET_REPO" ]]; then
              echo "::error::Only the repository's dev branch may be promoted into main."
              exit 1
            fi
          elif [[ "$BASE" != "dev" ]]; then
            echo "::error::Feature and fix PRs must target dev first."
            exit 1
          fi
          echo "Branch routing OK: $HEAD -> $BASE"
