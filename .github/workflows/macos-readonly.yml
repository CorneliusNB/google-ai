name: macOS diagnostic preview (offline)

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "run-macos.sh"
      - "macos_runner.py"
      - "tui.py"
      - "tui_core.py"
      - "tests/test_macos.py"
      - ".github/workflows/macos-readonly.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-diagnostics:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Textual and pinned Frida
        run: |
          python -m pip install --disable-pip-version-check -r requirements-tui.txt "frida==16.5.9"
          python -c "import importlib.metadata as m; import textual, frida; assert m.version('frida') == '16.5.9'"
      - name: Check macOS entrypoint syntax and help
        run: |
          sh -n run-macos.sh
          sh run-macos.sh --help
          python -m py_compile macos_runner.py tui.py tui_core.py
      - name: Offline diagnostic and checkout-guard regressions
        run: python -m unittest discover -s tests -p 'test_macos.py' -v
