name: Publish ePlus AI Toolkit v1.0.1 (manual)

on:
  workflow_dispatch:
    inputs:
      verified_device_smoke:
        description: "I completed docs/WINDOWS-SMOKE-TEST.md on real Windows + MuMu (no checkout)"
        type: boolean
        required: true
        default: false

concurrency:
  group: publish-eplus-ai-toolkit-v1.0.1
  cancel-in-progress: false

jobs:
  windows-smoke:
    permissions:
      contents: read
    uses: ./.github/workflows/windows-release-smoke.yml

  publish:
    name: Verify and publish source release
    needs: windows-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require main and real-device sign-off
        env:
          TESTED: ${{ inputs.verified_device_smoke }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow on main only."
            exit 1
          fi
          if [ "$TESTED" != "true" ]; then
            echo "::error::Real Windows + MuMu Step 0/1 smoke sign-off is required."
            exit 1
          fi
          test -f docs/releases/v1.0.1.md
          test -f docs/WINDOWS-SMOKE-TEST.md

      - name: Require passing main Static checks for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          url="repos/$GITHUB_REPOSITORY/actions/workflows/static-checks.yml/runs?branch=main&per_page=1"
          check_sha="$(gh api "$url" --jq '.workflow_runs[0].head_sha')"
          check_result="$(gh api "$url" --jq '.workflow_runs[0].conclusion')"
          if [ "$check_sha" != "$GITHUB_SHA" ] || [ "$check_result" != "success" ]; then
            echo "::error::Latest main Static checks must pass for exact release commit $GITHUB_SHA (got $check_sha / $check_result)."
            exit 1
          fi

      - name: Publish 1.0.1 tag and GitHub source archives
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view 1.0.1 >/dev/null 2>&1; then
            echo "::error::Release 1.0.1 already exists; refusing to overwrite it."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/1.0.1 >/dev/null 2>&1; then
            echo "::error::Tag 1.0.1 already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create 1.0.1 --target "$GITHUB_SHA" --title "ePlus AI Toolkit v1.0.1" --notes-file docs/releases/v1.0.1.md --latest
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/1.0.1"
