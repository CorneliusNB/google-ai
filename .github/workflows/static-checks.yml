name: Static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m compileall -q ultra0.py setup_env.py query_sku.py
      - name: Frida compatibility tests (mocked, no Android)
        run: python -m unittest discover -s tests -p 'test_frida_compat.py' -v
      - name: Device/account diagnostic unit tests (no Android or purchases)
        run: python -m unittest discover -s tests -p 'test_device_diagnostics.py' -v
      - name: Billing launch diagnostics tests (no Android/purchases)
        run: python -m unittest discover -s tests -p 'test_launch_diagnostics.py' -v
      - name: Playwright runner syntax
        run: node --check scripts/playwright-android.mjs
      - name: Pure Node unit tests (no Android or purchases)
        run: node --test tests/playwright-runner.test.mjs
      - name: Playwright CLI dry run
        run: node scripts/playwright-android.mjs run --step 1 --email example@example.com --dry-run
