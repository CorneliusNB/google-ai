name: Static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python
        run: python -m compileall -q ultra0.py setup_env.py query_sku.py
      - name: Run no-device tests (includes Frida JavaScript syntax check)
        run: python -m unittest discover -s tests -v
